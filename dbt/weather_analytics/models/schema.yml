version: 2

models:
  - name: stg_weather_data
    description: Cleaned weather data from the raw Snowflake table.

    columns:
      - name: city
        tests:
          - not_null
          - accepted_values:
              values: ['San Jose', 'San Francisco']

      - name: date
        tests:
          - not_null

      - name: avg_temp
        tests:
          - not_null

  - name: weather_metrics
    description: Weather analytics containing moving average, rolling rainfall, and temperature anomaly.

    columns:
      - name: city
        tests:
          - not_null

      - name: date
        tests:
          - not_null

      - name: moving_avg_7d
        tests:
          - not_null

      - name: rolling_rainfall_7d
        tests:
          - not_null

      - name: temperature_anomaly
        tests:
          - not_null